name: Publish to WordPress.com

# For WordPress.com GitHub deployments in advanced mode. This repo is connected
# with /wp-content/plugins/tufte-places as the destination, so the artifact is
# the plugin itself: tufte-places.php, assets, includes, and templates.
# tests, docs, README.md, .gitignore, and .github never leave GitHub; that's why
# this workflow exists (simple mode copies the whole repo).
# Modeled on Tufte Formats' workflow. With several include paths,
# upload-artifact v4 roots the artifact at their least common ancestor, the
# repo root, so the paths land directly in the connection's destination.
# workflow_dispatch only works once this file is on the default branch.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Build the wpcom artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpcom
          path: |
            tufte-places.php
            assets
            includes
            templates
          retention-days: 1
